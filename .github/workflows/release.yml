name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Must come before setup-node: its package-manager-cache (default true in v7)
      # reads the packageManager field and runs `pnpm`, which fails if pnpm is not
      # installed yet.
      - uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: npm i -g npm@latest

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      # core publishes first: the CLI's workspace:* dependency on it resolves
      # to the new version at pack time and must already exist in the registry.
      # Publishing uses trusted publishing (OIDC) — no NPM_TOKEN secret needed.
      - name: Publish core to NPM
        run: |
          pnpm run build
          TARBALL=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npm publish "$TARBALL" --access public
        working-directory: ./packages/core

      - name: Publish CLI to NPM
        run: |
          pnpm run build
          TARBALL=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npm publish "$TARBALL" --access public
        working-directory: ./packages/cli
